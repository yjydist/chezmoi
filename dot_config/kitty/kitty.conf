include One Half Dark.conf

font_family      family='MesloLGM Nerd Font' style=Regular
bold_font        family='MesloLGM Nerd Font' style=Regular
italic_font      family='MesloLGM Nerd Font' style=Regular
bold_italic_font family='MesloLGM Nerd Font' style=Regular

font_size 10.5

env LANG=en_US.UTF-8
env LC_ALL=en_US.UTF-8
shell fish

window_padding_width 5 10
remember_window_size  no
remember_window_position no
initial_window_width  1100
initial_window_height 600

# cell width and height settings
modify_font cell_width 100%
modify_font cell_height 100%

# underline settings
modify_font underline_position 115%
modify_font underline_thickness 150%
